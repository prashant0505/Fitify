name: Verify FitiFy
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FITIFY_E2E_MANAGED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r document-service/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation fonts-dejavu-core
        if: runner.os == 'Linux'
      - run: brew install --cask libreoffice
        if: runner.os == 'macOS'
      - run: choco install libreoffice-fresh --yes --no-progress
        if: runner.os == 'Windows'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python -m unittest discover -s document-service -p 'test_*.py' -v
      - run: python scripts/create-test-fixture.py
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - name: Browser workflows
        run: npm run test:e2e -- --update-snapshots=missing
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures-${{ runner.os }}
          path: test-results/
